name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["main"] # main 브랜치에 push될 때마다 실행

  # Pages 설정 화면에서 수동으로도 실행할 수 있도록 허용
  workflow_dispatch:

# GITHUB_TOKEN의 권한을 설정 (Pages 배포에 필수)
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 실행되면 하나만 유지하고 나머지는 취소
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 사용 중인 Node 버전 (보통 20 추천)
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # package-lock.json 기준으로 깔끔하게 의존성 설치

      - name: Build
        run: npm run build # Vite 번들링을 GitHub 서버가 대신 실행합니다!

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite의 결과물 폴더인 dist를 업로드합니다.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
